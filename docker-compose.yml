version: '3.8'

services:
  # Redis 任务队列服务 (限额：内存 150MB，CPU 0.5核)
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: timecollate-redis
    restart: unless-stopped
    command: redis-server --maxmemory 104857600 --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 150M

  # 后端 API 与 Export Worker 服务 (限额：内存 900MB，为 PDF 导出的 Playwright 留出空间，CPU 1.5核)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: timecollate-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-123456}
      # 限制 Node V8 堆内存最大为 384MB，防止内存溢出
      - NODE_OPTIONS=--max-old-space-size=384
    env_file:
      - ./server/.env
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 900M

volumes:
  redis_data:
