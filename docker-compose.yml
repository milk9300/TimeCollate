version: '3.8'

services:
  # MySQL 数据库服务
  mysql:
    image: mysql:8.0
    container_name: timecollate-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: lsh0903
      MYSQL_DATABASE: timecollate
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API 服务
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: timecollate-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=lsh0903
      - MYSQL_DATABASE=timecollate
      - FRONTEND_URL=http://host.docker.internal:5173
    env_file:
      - ./server/.env
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
